name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve pinned Blizzard source
        if: matrix.node == 24
        id: source
        run: node -e "const m=require('./data/manifest.json');console.log('commit='+m.versions.find(v=>v.version===m.default).commit);console.log('old_commit='+m.versions[0].commit);console.log('old_version='+m.versions[0].clientVersion)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: matrix.node == 24
        with:
          repository: Gethe/wow-ui-source
          ref: ${{ steps.source.outputs.commit }}
          path: .cache/wow-ui-source
      - name: Verify deterministic dataset extraction
        if: matrix.node == 24
        run: |
          npm run data:build
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const m = JSON.parse(readFileSync('data/manifest.json', 'utf8'));
          const file = 'data/' + m.versions.find(v => v.version === m.default).file;
          const before = execFileSync('git', ['show', 'HEAD:' + file], { maxBuffer: 50 * 1024 * 1024 });
          const after = readFileSync(file);
          if (!before.equals(after)) {
            const left = gunzipSync(before).toString();
            const right = gunzipSync(after).toString();
            let at = 0;
            while (at < Math.min(left.length, right.length) && left[at] === right[at]) at++;
            console.error({ node: process.version, zlib: process.versions.zlib, sameContent: left === right,
              firstDifference: at, before: left.slice(at - 100, at + 200), after: right.slice(at - 100, at + 200) });
          }
          NODE
          git diff --exit-code -- data/manifest.json data/retail data/resources
      - uses: actions/checkout@v7
        if: matrix.node == 24
        with:
          repository: Gethe/wow-ui-source
          ref: ${{ steps.source.outputs.old_commit }}
          path: .cache/wow-ui-oldest
      - name: Verify oldest API and partial resource rebuilds
        if: matrix.node == 24
        run: |
          node scripts/build-dataset.mjs --source .cache/wow-ui-oldest --client-version '${{ steps.source.outputs.old_version }}' --api-only --manifest .cache/api-check/manifest.json --output .cache/api-check/snapshot.json.gz
          node scripts/build-dataset.mjs --source .cache/wow-ui-oldest --client-version '${{ steps.source.outputs.old_version }}' --allow-partial-resources --manifest .cache/resource-check/manifest.json --output .cache/resource-check/snapshot.json.gz
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const entry = JSON.parse(readFileSync('data/manifest.json', 'utf8')).versions[0];
          assert.ok(readFileSync('data/' + entry.file).equals(readFileSync('.cache/api-check/snapshot.json.gz')), 'Historical API archive drift');
          assert.ok(readFileSync('data/' + entry.resourceFile).equals(readFileSync('.cache/resource-check/' + entry.resourceFile)), 'Historical resource archive drift');
          NODE
      - if: matrix.node == 24
        run: npm run pack:check
